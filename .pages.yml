# Editor do dono da JAMBO (Pages CMS: app.pagescms.org).
# Só conteúdo. Logo, cores, fontes e layout ficam fora do editor de propósito.
#
# Para quem mexer neste arquivo:
# - O Pages CMS APAGA, ao salvar, todo dado do JSON que não esteja listado aqui. Campo novo nos dados = campo novo aqui.
# - Tudo o que o editor salva passa por ferramentas/validar.mjs antes de publicar. Se houver problema, o build para
#   (o site continua no ar com a versão anterior) e o GitHub avisa por e-mail com o que corrigir.
# - Os limites daqui (obrigatório, tamanho máximo, mínimo e máximo) são a primeira trava, dentro do próprio editor.
#   A validação é a segunda. Ao mudar um limite, mude nos dois lugares.
# - Componente (component:) não leva o nome junto: cada uso precisa do seu "name".
# - Rótulos e descrições com vírgula ou dois-pontos precisam de aspas.

media:
  - name: fotos
    label: Fotos
    input: public/assets/img
    output: /assets/img
    extensions: [webp, jpg, jpeg, png]
  - name: desenhos
    label: Desenhos dos ingredientes
    input: public/assets/ingredientes
    output: /assets/ingredientes
    extensions: [svg, webp, png]

components:
  codigo:
    label: Código interno
    type: string
    hidden: true
  esgotado:
    label: Esgotado hoje
    description: "Marcado: o item aparece riscado e não dá para pedir. Desmarque quando voltar."
    type: boolean
    default: false
  preco:
    label: "Preço (R$)"
    description: "Só o número, com os centavos. Ex.: 26,90"
    type: number
    required: true
    options: { min: 0.01, max: 499, step: 0.01 }
  descricaoFoto:
    label: Descrição da foto
    description: "Uma frase dizendo o que aparece na foto. É o que o leitor de tela lê para quem não enxerga."
    type: string
    required: true
    options: { maxlength: 160 }
  precoPromo:
    label: "Preço promocional (R$)"
    description: "Opcional. Menor que o preço normal. No site, o preço normal aparece riscado."
    type: number
    options: { min: 0.01, max: 499, step: 0.01 }
  promoInicio:
    label: Promoção começa em
    description: "Vazio: começa já."
    type: date
  promoFim:
    label: Promoção termina em
    description: "Último dia com o preço promocional. Vazio: vale até você apagar o preço promocional."
    type: date
  cor:
    label: Cor do desenho
    type: select
    options:
      values: [Vermelho, Rosa, Laranja, Amarelo, Creme, Branco, Verde-claro, Verde, Roxo, Azul, Bege, Marrom-claro, Marrom, Chocolate, Preto]

content:
  - name: cardapio
    label: Cardápio
    type: group
    items:
      - name: acai
        label: Açaí da casa
        type: file
        path: content/cardapio/acai.json
        format: json
        fields:
          - name: itens
            label: Bowls
            type: object
            list: { min: 1, max: 12, collapsible: { collapsed: true, summary: "{nome} · R$ {preco}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 28 } }
              - { name: descricao, label: Descrição, description: "O que vai no bowl.", type: text, required: true, options: { maxlength: 160 } }
              - { name: preco, component: preco }
              - { name: kcal, label: "Calorias (500 ml)", description: "Aproximadas. Sem elas, o site não mostra a estimativa.", type: number, options: { min: 0, max: 3000 } }
              - { name: imagem, label: Foto, description: "Em pé, proporção 4 por 5. O site corta o que sobrar e deixa a foto leve.", type: image, required: true, options: { media: fotos } }
              - { name: alt, label: Descrição da foto, description: "Pode ficar vazia: o nome e a descrição do bowl já aparecem ao lado.", type: string, options: { maxlength: 160 } }
              - { name: esgotado, component: esgotado }
              - { name: precoPromo, component: precoPromo }
              - { name: promoInicio, component: promoInicio }
              - { name: promoFim, component: promoFim }
              - name: ingredientes
                label: Ingredientes que voam
                description: "Até 4. Aparecem voando sobre a foto do bowl; os 2 primeiros também no celular."
                type: reference
                options: { collection: ingredientes, multiple: true, max: 4, value: "{path}", label: "{nome}", search: "nome" }

      - name: ingredientes
        label: Ingredientes (toppings e adicionais)
        type: collection
        path: content/ingredientes
        format: json
        filename: "{primary}.json"
        view:
          fields: [nome, tipo, esgotado]
          primary: nome
          sort: [ordem, nome]
          default: { sort: ordem, order: asc }
        fields:
          - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 28 } }
          - name: tipo
            label: Tipo
            description: "Topping: entra nos inclusos. Adicional: sempre cobrado à parte (e é o que vai no gelato)."
            type: select
            required: true
            options:
              values: [{ value: topping, label: Topping }, { value: adicional, label: Adicional }]
          - { name: ordem, label: Ordem na bancada, description: "1 aparece primeiro.", type: number, options: { min: 1, max: 99, step: 1 } }
          - { name: kcal, label: Calorias da porção, type: number, options: { min: 0, max: 1000 } }
          - { name: esgotado, component: esgotado }
          - { name: desenho, label: Desenho, description: "Quadrado, com fundo transparente (SVG ou PNG). Sem desenho, o site cria um com o estilo e a cor abaixo.", type: image, options: { media: desenhos } }
          - name: estilo
            label: Como aparece no copo
            description: "Para ingrediente novo. Os originais já têm desenho próprio dentro do copo."
            type: select
            options:
              values: [{ value: pedacos, label: "Pedaços (frutas, cubos)" }, { value: salpicado, label: "Salpicado (farofa, granulado)" }, { value: calda, label: Calda }, { value: creme, label: "Creme (colherada)" }]
          - name: cor
            component: cor
            description: "Para ingrediente novo: cor dos pedaços dentro do copo e do desenho criado pelo site."

      - name: montador
        label: Monte seu Jambo (regras e preços)
        type: file
        path: content/cardapio/montador.json
        format: json
        fields:
          - { name: toppingsGratis, label: Toppings inclusos, type: number, required: true, options: { min: 0, max: 10, step: 1 } }
          - { name: precoExtra, label: "Preço do topping extra e de cada adicional (R$)", type: number, required: true, options: { min: 0, max: 99, step: 0.01 } }
          - name: bases
            label: "Bases (fixas: dá para mudar o nome e as calorias)"
            type: object
            list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{nome}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 28 } }
              - name: kcal
                label: Calorias por tamanho
                type: object
                fields:
                  - { name: "300", label: 300 ml, type: number, options: { min: 0, max: 3000 } }
                  - { name: "500", label: 500 ml, type: number, options: { min: 0, max: 3000 } }
                  - { name: "700", label: 700 ml, type: number, options: { min: 0, max: 3000 } }
          - name: tamanhos
            label: "Tamanhos (fixos: dá para mudar o preço)"
            type: object
            list: { min: 3, max: 3, collapsible: { collapsed: true, summary: "{ml} ml · R$ {preco}" } }
            fields:
              - { name: ml, label: ml, type: number, readonly: true }
              - { name: preco, component: preco }

      - name: gelato
        label: Gelato
        type: file
        path: content/cardapio/gelato.json
        format: json
        fields:
          - { name: imagem, label: Foto, description: "Deitada e bem larga (21 por 9). O site corta o que sobrar.", type: image, required: true, options: { media: fotos } }
          - { name: alt, component: descricaoFoto }
          - { name: doisSabores, label: "Copinho de 2 sabores (R$)", type: number, required: true, options: { min: 0.01, max: 499, step: 0.01 } }
          - { name: tresSabores, label: "Copinho de 3 sabores (R$)", type: number, required: true, options: { min: 0.01, max: 499, step: 0.01 } }
          - { name: nota, label: Observação, description: "Ex.: tamanho da bola.", type: string, options: { maxlength: 120 } }
          - name: sabores
            label: Sabores
            type: object
            list: { min: 1, max: 12, collapsible: { collapsed: true, summary: "{nome} · R$ {preco}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 24 } }
              - { name: preco, component: preco, label: "Preço de 1 sabor (R$)" }
              - { name: kcal, label: Calorias da bola, type: number, options: { min: 0, max: 1000 } }
              - { name: esgotado, component: esgotado }
              - { name: cor, label: Desenho pronto, type: string, hidden: true }
              - { name: corMassa, component: cor, label: Cor da massa, description: "Para sabor novo. Os originais já têm cor própria." }

      - name: milkshakes
        label: Milkshakes
        type: file
        path: content/cardapio/milkshakes.json
        format: json
        fields:
          - { name: imagem, label: Foto, description: "Em pé, proporção 4 por 5.", type: image, required: true, options: { media: fotos } }
          - { name: alt, component: descricaoFoto }
          - { name: tamanho, label: Tamanho do copo, description: "Ex.: 400 ml", type: string, required: true, options: { maxlength: 20 } }
          - name: itens
            label: Milkshakes
            type: object
            list: { min: 1, max: 12, collapsible: { collapsed: true, summary: "{nome} · R$ {preco}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 28 } }
              - { name: descricao, label: Descrição, type: text, required: true, options: { maxlength: 140 } }
              - { name: preco, component: preco }
              - { name: esgotado, component: esgotado }
              - { name: precoPromo, component: precoPromo }
              - { name: promoInicio, component: promoInicio }
              - { name: promoFim, component: promoFim }

      - name: combos
        label: Combos
        type: file
        path: content/cardapio/combos.json
        format: json
        fields:
          - { name: imagem, label: Foto, description: "Quase quadrada (5 por 4).", type: image, required: true, options: { media: fotos } }
          - { name: alt, component: descricaoFoto }
          - { name: regra, label: Regra, description: "Aparece embaixo dos combos e na hora de montar.", type: text, options: { maxlength: 200 } }
          - name: itens
            label: Combos
            type: object
            list: { min: 1, max: 6, collapsible: { collapsed: true, summary: "{nome} · R$ {preco}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 24 } }
              - { name: descricao, label: Descrição, description: "O que vem no combo.", type: text, required: true, options: { maxlength: 160 } }
              - { name: preco, component: preco }
              - { name: esgotado, component: esgotado }
              - { name: precoPromo, component: precoPromo }
              - { name: promoInicio, component: promoInicio }
              - { name: promoFim, component: promoFim }
              - name: partes
                label: "O que o cliente escolhe (até 3; sem nenhuma, o combo vai direto para o pedido)"
                type: object
                list: { max: 3, collapsible: { collapsed: false, summary: "{tipo} {ml} {tamanho}" } }
                fields:
                  - name: tipo
                    label: Tipo
                    description: "As partes também decidem os copos 3D do combo."
                    type: select
                    required: true
                    options:
                      values: [{ value: acai, label: Açaí }, { value: bebida, label: Bebida }, { value: milkshake, label: Milkshake }]
                  - { name: ml, label: "Tamanho do açaí em ml (só para açaí)", description: "300, 500 ou 700", type: number, options: { min: 300, max: 700, step: 200 } }
                  - { name: tamanho, label: "Tamanho do milkshake (só para milkshake)", description: "Ex.: 300 ml", type: string, options: { maxlength: 20 } }

      - name: bebidas
        label: Bebidas
        type: file
        path: content/cardapio/bebidas.json
        format: json
        fields:
          - name: itens
            label: Bebidas
            type: object
            list: { min: 1, max: 20, collapsible: { collapsed: true, summary: "{nome} · R$ {preco}" } }
            fields:
              - { name: id, component: codigo }
              - { name: nome, label: Nome, type: string, required: true, options: { maxlength: 32 } }
              - { name: preco, component: preco }
              - { name: esgotado, component: esgotado }
              - { name: precoPromo, component: precoPromo }
              - { name: promoInicio, component: promoInicio }
              - { name: promoFim, component: promoFim }

  - name: promocoes
    label: Promoções e cupons
    type: group
    items:
      - name: avisos
        label: Avisos de promoção
        type: file
        path: content/promocoes.json
        format: json
        fields:
          - name: avisos
            label: "Avisos (aparecem logo depois da abertura; até 3 ao mesmo tempo)"
            type: object
            list: { max: 6, collapsible: { collapsed: true, summary: "{titulo} · até {fim}" } }
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 40 } }
              - { name: texto, label: Texto, description: "O que é a promoção e a regra. Ex.: Jambo Classic por R$ 22,90 até domingo.", type: text, required: true, options: { maxlength: 160 } }
              - { name: inicio, label: Começa em, description: "Vazio: aparece já.", type: date }
              - { name: fim, label: Termina em, description: "Último dia em que o aviso aparece. Depois disso ele some sozinho.", type: date, required: true }
              - name: secao
                label: Botão leva para
                type: select
                options:
                  values: [{ value: acai, label: Açaí da casa }, { value: monte, label: Monte seu Jambo }, { value: gelato, label: Gelato }, { value: milkshakes, label: Milkshakes }, { value: combos, label: Combos }, { value: bebidas, label: Bebidas }, { value: nenhum, label: Sem botão }]
              - { name: botao, label: Texto do botão, description: "Ex.: Ver o Jambo Classic. Vazio: Ver no cardápio.", type: string, options: { maxlength: 28 } }

      - name: cupons
        label: Cupons de desconto
        type: file
        path: content/cupons.json
        format: json
        fields:
          - name: cupons
            label: "Cupons: o site confere o código e calcula o desconto. O código não aparece escrito no site"
            type: object
            list: { max: 50, collapsible: { collapsed: true, summary: "{codigo}" } }
            fields:
              - { name: codigo, label: Código, description: "Letras maiúsculas e números, sem espaço. Ex.: VERAO10", type: string, required: true, pattern: { regex: "^[A-Z0-9-]{3,20}$", message: "Use de 3 a 20 letras maiúsculas, números ou hífen, sem espaço. Ex.: VERAO10" } }
              - name: tipo
                label: Tipo de desconto
                type: select
                required: true
                default: porcentagem
                options:
                  values:
                    - { value: porcentagem, label: "Porcentagem do pedido (%)" }
                    - { value: valor, label: "Valor fixo em reais (R$)" }
              - { name: valor, label: Desconto, description: "Só o número. Porcentagem: 10 é 10%. Valor fixo: 5 é R$ 5,00.", type: number, required: true, options: { min: 0.01, max: 500, step: 0.01 } }
              - { name: minimo, label: "Pedido mínimo (R$)", description: "Vazio: vale para qualquer pedido. Ex.: 40", type: number, options: { min: 0, max: 2000, step: 0.01 } }
              - { name: validoAte, label: Válido até, description: "Vazio: vale até você desligar. No dia seguinte a esta data, o site para de aceitar.", type: date }
              - { name: ativo, label: Ativo, description: "Desligado: o site não aceita mais o cupom, mas ele fica guardado aqui.", type: boolean, default: true }
              - { name: observacao, label: Observação, description: "Só para você. Ex.: onde foi divulgado, um uso por cliente.", type: text, options: { maxlength: 200 } }

  - name: loja
    label: Loja
    type: group
    items:
      - name: dados
        label: Dados, horário e pagamento
        type: file
        path: content/loja.json
        format: json
        fields:
          - { name: nome, label: Nome da loja, type: string, required: true, options: { maxlength: 60 } }
          - { name: endereco, label: Endereço completo, description: "Como aparece no site e no mapa. Ex.: Rua Bocaiúva, 1842 — Centro, Florianópolis/SC", type: string, required: true, options: { maxlength: 120 } }
          - { name: rua, label: Rua e número, type: string, required: true, options: { maxlength: 80 } }
          - { name: bairro, label: Bairro, type: string, required: true, options: { maxlength: 60 } }
          - { name: cidade, label: Cidade, type: string, required: true, options: { maxlength: 60 } }
          - { name: uf, label: UF, type: string, required: true, pattern: { regex: "^[A-Z]{2}$", message: "Use a sigla com 2 letras maiúsculas. Ex.: SC" } }
          - { name: whatsapp, label: WhatsApp dos pedidos, description: "Só números, com 55 e o DDD. Ex.: 5548999990000", type: string, required: true, pattern: { regex: "^55[0-9]{10,11}$", message: "Só números, começando com 55 e o DDD. Ex.: 5548999990000" } }
          - { name: whatsappTexto, label: WhatsApp como aparece no site, description: "Ex.: (48) 99999-0000", type: string, required: true, options: { maxlength: 24 } }
          - { name: instagram, label: Instagram, description: "Com @. Ex.: @jambo.gelato", type: string, required: true, pattern: { regex: "^@[A-Za-z0-9._]{1,30}$", message: "Use o @ e o nome do perfil, sem espaço. Ex.: @jambo.gelato" } }
          - { name: entrega, label: Entrega, description: "Bairros atendidos e taxa.", type: text, required: true, options: { maxlength: 200 } }
          - name: pagamentos
            label: "Formas de pagamento (aparecem no pedido nesta ordem; a primeira já vem marcada)"
            type: string
            list: { min: 1, max: 6 }
            options: { maxlength: 30 }
          - { name: aceitaCupom, label: "Mostrar o campo \"Cupom de desconto\" no pedido", description: "Os cupons ficam em Promoções e cupons → Cupons.", type: boolean, default: true }
          - name: horario
            label: Horário
            type: object
            list: { min: 7, max: 7, collapsible: { collapsed: true, summary: "{dia}: {abre}–{fecha}" } }
            fields:
              - { name: dia, label: Dia, type: string, readonly: true }
              - { name: fechado, label: Fechado neste dia, type: boolean, default: false }
              - { name: abre, label: Abre, description: "Ex.: 13:00", type: string, pattern: { regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$", message: "Use o formato 13:00" } }
              - { name: fecha, label: Fecha, description: "Ex.: 22:00. Fecha à meia-noite? Use 00:00.", type: string, pattern: { regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$", message: "Use o formato 22:00" } }
          - { name: fotosIlustrativas, label: "Mostrar o aviso \"Imagem ilustrativa\"", description: "Desmarque quando todas as fotos forem da loja de verdade.", type: boolean, default: true }
          - { name: compartilharTexto, label: Texto do card de compartilhamento, description: "Aparece quando o link é mandado no WhatsApp ou nas redes.", type: text, required: true, options: { maxlength: 200 } }
          - { name: compartilharAlt, label: Descrição da imagem do card, type: string, required: true, options: { maxlength: 200 } }
          - { name: site, label: Endereço do site, type: string, readonly: true }
          - { name: planilhaPedidos, label: "Endereço da planilha de pedidos (Apps Script)", description: "Opcional. Com ele, cada pedido do site também cai na planilha. Começa com https://script.google.com/macros/s/ e termina com /exec. Em branco: o pedido vai só pelo WhatsApp.", type: string, pattern: { regex: "^$|^https://script\\.google\\.com/macros/s/[A-Za-z0-9_-]+/exec$", message: "Cole o endereço do Apps Script inteiro, que termina com /exec" } }
          - { name: whatsappLeticia, label: "WhatsApp do botão \"Quero um site assim\"", type: string, hidden: true }

      - name: textos
        label: Textos da página
        type: file
        path: content/textos.json
        format: json
        fields:
          - name: seo
            label: Busca do Google
            type: object
            fields:
              - { name: titulo, label: Título na busca, type: string, required: true, options: { maxlength: 70 } }
              - { name: descricao, label: Descrição na busca, type: text, required: true, options: { maxlength: 200 } }
          - name: inicio
            label: Abertura
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 40 } }
              - { name: texto, label: Texto, type: text, required: true, options: { maxlength: 180 } }
              - { name: botaoCardapio, label: Botão do cardápio, type: string, required: true, options: { maxlength: 24 } }
              - { name: botaoMontar, label: Botão de montar, type: string, required: true, options: { maxlength: 24 } }
          - name: acai
            label: Açaí
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 50 } }
              - { name: tamanho, label: Tamanho dos bowls da casa, description: "Ex.: Todos os bowls da casa vêm no copo de 500 ml.", type: string, required: true, options: { maxlength: 80 } }
              - { name: chamada, label: Chamada para montar, type: text, required: true, options: { maxlength: 120 } }
              - { name: botao, label: Botão, type: string, required: true, options: { maxlength: 24 } }
          - name: gelato
            label: Gelato
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 40 } }
              - { name: botao, label: Botão, type: string, required: true, options: { maxlength: 24 } }
          - name: monte
            label: Monte seu Jambo
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 60 } }
          - name: milkshakes
            label: Milkshakes
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 70 } }
          - name: bebidas
            label: Bebidas
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 40 } }
          - name: final
            label: Fim da página
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 40 } }
              - { name: botao, label: Botão, type: string, required: true, options: { maxlength: 24 } }
          - name: visite
            label: Visite
            type: object
            fields:
              - { name: titulo, label: Título, type: string, required: true, options: { maxlength: 50 } }
              - { name: texto, label: Texto, description: "Se o endereço mudar, confira este texto.", type: text, required: true, options: { maxlength: 240 } }
              - { name: foto1, label: Foto 1, description: "Deitada (3 por 2).", type: image, options: { media: fotos } }
              - { name: foto1Descricao, label: Descrição da foto 1, type: string, options: { maxlength: 160 } }
